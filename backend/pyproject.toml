[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Permite repetir nombres de archivo (test_routes.py, test_service.py) en cada módulo.
addopts = "--import-mode=importlib"
